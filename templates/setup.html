<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Required</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="dashboard">

    <div class="card settings-card">

        <h1>🚀 First-Time Setup</h1>

        <p>
            Enter the location you would like to use for your weather dashboard.
        </p>

        <p class="settings-note">
            The OpenWeatherMap API key is loaded from the application's
            <code>.env</code> file.
        </p>

        <form method="POST" action="{{ url_for('settings') }}">

            <label for="city">City</label>
            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter City"
                required
            >

            <label for="state">State</label>
            <input
                type="text"
                id="state"
                name="state"
                placeholder="Enter State (e.g. TX)"
                required
            >

            <label for="country">Country</label>
            <input
                type="text"
                id="country"
                name="country"
                placeholder="Enter Country (e.g. US)"
                required
            >

            <button type="submit">Start Dashboard</button>

        </form>

    </div>

</div>

</body>
</html>
